<VirtualHost *:80>

    ServerName polanco-rueda-f4.m3examen.com

    DocumentRoot /var/www/polanco-rueda-f4

    <Directory /var/www/polanco-rueda-f4>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On

    ProxyPass        /api/usuarios http://127.0.0.1:3001/usuarios
    ProxyPassReverse /api/usuarios http://127.0.0.1:3001/usuarios

    ProxyPass        /api/eventos http://127.0.0.1:3011/eventos
    ProxyPassReverse /api/eventos http://127.0.0.1:3011/eventos

    ProxyPass        /api/auditorios http://127.0.0.1:3012/auditorios
    ProxyPassReverse /api/auditorios http://127.0.0.1:3012/auditorios

</VirtualHost>
